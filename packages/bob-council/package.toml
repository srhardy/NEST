path = "agents/researcher.md"

[[agents]]
name = "codebase-mapper"
path = "agents/codebase-mapper.md"

[[agents]]
name = "ui-auditor"
path = "agents/ui-auditor.md"

[[agents]]
name = "assumptions-analyzer"
path = "agents/assumptions-analyzer.md"

