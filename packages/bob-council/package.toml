name = "bob-council"
version = "0.1.0"
description = "The Boss's council — BobTheBuilder's 8 specialist sub-agents and 6 skills, packaged for NEST"
tier = "curated"

[source]
path = "."

# The council — specialist bots that spool as subagents, return results, and
# auto-clean. Pair with a `boss = true` bot and [[routing]] entries in
# agent.toml to get the full Boss -> Assistant -> Council pattern.
