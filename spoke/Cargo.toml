[workspace]
resolver = "2"
members = [
    "crates/spoke-core",
    "crates/spoke-adapters",
    "crates/spoke-registry",
    "crates/spoke-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/local/spoke"
description = "One hub for every coding agent: config sync, skill packages, token budgets."

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
toml_edit = "0.22"
clap = { version = "4", features = ["derive", "env"] }
sha2 = "0.10"
tempfile = "3"
