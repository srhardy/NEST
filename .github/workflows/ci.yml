name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build + test spoke
        working-directory: spoke
        run: |
          cargo build
          cargo test
      - name: build + test nest
        working-directory: nest
        run: |
          cargo build
          cargo test

  rust-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            spoke
            nest
      - name: unix tools for test fixtures (sh, cat)
        shell: pwsh
        run: echo "C:\Program Files\Git\usr\bin" >> $env:GITHUB_PATH
      - name: build + test spoke
        working-directory: spoke
        run: |
          cargo build
          cargo test
      - name: build + test nest
        working-directory: nest
        run: |
          cargo build
          cargo test

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install GTK deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwebkit2gtk-4.1-dev libsoup-3.0-dev librsvg2-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build desktop
        working-directory: desktop
        run: cargo build
